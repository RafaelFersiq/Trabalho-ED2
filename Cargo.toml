[package]
name = "storage-engine"
version = "0.1.0"
edition = "2021"
authors = ["Equipe ED2"]
description = "Adaptive Storage Engine (LSM-Tree) para a disciplina de Estruturas de Dados 2"

[[bin]]
name = "engine"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crc32fast = "1.4"
byteorder = "1.5"

[dev-dependencies]
tempfile = "3.10"
